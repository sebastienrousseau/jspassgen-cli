# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Lint (eslint with the complexity ceilings, prettier, shellcheck, npm
# audit) and the tests on Node.js 22 and 24 at 100% coverage. The same
# commands run locally through `make check` and `make audit`.
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format, complexity, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Locked install
        run: make install
      - name: eslint (complexity 10, cognitive 15, 60 lines per function, 500 per file)
        run: make lint
      - name: prettier
        run: make format-check
      - name: Shell scripts (shellcheck)
        run: shellcheck scripts/*.sh
      - name: Known vulnerabilities in locked dependencies (npm audit)
        run: make audit

  test:
    name: Tests and coverage (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Tests, gate at 100% coverage
        run: make install test
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
